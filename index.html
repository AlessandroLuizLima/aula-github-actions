<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro de Pessoa Física</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    #resultado { margin-top: 20px; padding: 12px; border-radius: 4px; }
    .ok { background: #dcfce7; color: #166534; }
    .erro { background: #fee2e2; color: #991b1b; }
    .erro ul { margin: 6px 0 0; padding-left: 20px; }
  </style>
</head>
<body>
  <h1>Cadastro de Pessoa Física</h1>

  <form id="form-cadastro">
    <label>Nome
      <input type="text" name="nome" />
    </label>
    <label>CPF
      <input type="text" name="cpf" />
    </label>
    <label>E-mail
      <input type="email" name="email" />
    </label>
    <label>Data de nascimento (AAAA-MM-DD)
      <input type="date" name="data_nascimento" />
    </label>
    <label>
      <input type="checkbox" name="possui_cnh" /> Possui CNH
    </label>
    <button type="submit" style="margin-top: 16px;">Validar cadastro</button>
  </form>

  <div id="resultado"></div>

  <script src="pessoaFisica.js"></script>
  <script>
    document.getElementById('form-cadastro').addEventListener('submit', function (evento) {
      evento.preventDefault();
      const dados = new FormData(evento.target);
      const pessoa = {
        nome: dados.get('nome'),
        cpf: dados.get('cpf'),
        email: dados.get('email'),
        data_nascimento: dados.get('data_nascimento'),
        possui_cnh: dados.get('possui_cnh') === 'on',
      };

      const erros = PessoaFisica.validar(pessoa);
      const resultado = document.getElementById('resultado');

      if (erros.length === 0) {
        resultado.className = 'ok';
        resultado.textContent = 'Cadastro válido!';
      } else {
        resultado.className = 'erro';
        resultado.innerHTML = '<strong>Erros encontrados:</strong><ul>' +
          erros.map((e) => `<li>${e}</li>`).join('') + '</ul>';
      }
    });
  </script>
</body>
</html>
